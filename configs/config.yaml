scanner:
  interval: 30s
  min_spread_percent: 1.0
  max_data_age: 10s

exchanges:
  binance:
    enabled: true

  bybit:
    enabled: true

  mexc:
    enabled: false

  okx:
    enabled: false
    # При необходимости укажи официальный региональный URL, рекомендованный OKX для аккаунта:
    # base_url: https://eea.okx.com
    # Без base_url используется https://openapi.okx.com

  gate:
    enabled: false
    # Необязательно; по умолчанию https://api.gateio.ws
    # base_url: https://api.gateio.ws

  bitget:
    enabled: false

database:
  path: ./data/arbitrage.db
