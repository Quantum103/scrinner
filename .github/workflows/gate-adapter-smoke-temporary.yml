name: Gate adapter live smoke (temporary)

on:
  push:
    branches:
      - "feat/stage-8-gate-adapter"

permissions:
  contents: read

jobs:
  live-adapter:
    name: Проверить реальный адаптер Gate
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить Go из go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Загрузить рынки и пакетные котировки через адаптер
        env:
          GATE_LIVE: "1"
        run: go test ./internal/exchange/gate -run '^TestGateLivePublicAPI$' -v -count=1
