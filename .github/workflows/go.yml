name: Go checks

on:
  push:
    branches:
      - main
      - "feat/**"
      - "stage-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Go из go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Проверить форматирование изменённых Go-файлов Stage 10
        run: |
          gofmt -d cmd/scanner/main.go internal/arbitrage/detector.go internal/arbitrage/detector_test.go internal/exchange/bybit/tickers.go internal/price/snapshot.go internal/price/snapshot_test.go internal/scanner/runner.go internal/scanner/runner_test.go internal/scanner/runner_guard_test.go internal/storage/cycle.go internal/storage/cycle_test.go internal/storage/opportunities.go internal/storage/prices.go
          unformatted="$(gofmt -l cmd/scanner/main.go internal/arbitrage/detector.go internal/arbitrage/detector_test.go internal/exchange/bybit/tickers.go internal/price/snapshot.go internal/price/snapshot_test.go internal/scanner/runner.go internal/scanner/runner_test.go internal/storage/cycle.go internal/storage/cycle_test.go internal/storage/opportunities.go internal/storage/prices.go)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Запустить unit-тесты
        run: go test ./...

      - name: Запустить go vet
        run: go vet ./...

      - name: Собрать все пакеты проекта
        run: go build ./...
