name: Go checks

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Go из go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Запустить unit-тесты
        run: go test ./...

      - name: Запустить go vet
        run: go vet ./...

  live-smoke:
    name: Проверка реального публичного API Binance
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    timeout-minutes: 3
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Go из go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Отключить Bybit для smoke-проверки
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("configs/config.yaml")
          config = path.read_text(encoding="utf-8")
          old = "  bybit:\n    enabled: true"
          new = "  bybit:\n    enabled: false"
          if old not in config:
              raise SystemExit("Не удалось найти настройку Bybit в YAML")
          path.write_text(config.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Запустить один проход Binance по публичным данным
        run: go run ./cmd/scanner
