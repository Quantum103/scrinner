name: Go checks

on:
  push:
    branches:
      - main
      - "feat/**"
      - "stage-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Go из go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Проверить форматирование изменённых Go-файлов и storage-тестов Stage 10
        run: |
          gofmt -d cmd/scanner/*.go internal/arbitrage/*.go internal/market/*.go internal/config/*.go internal/storage/opportunities.go internal/exchange/bybit/tickers.go internal/exchange/mexc/*.go internal/exchange/okx/*.go internal/exchange/gate/*.go internal/exchange/bitget/*.go internal/price/snapshot.go internal/price/snapshot_test.go internal/scanner/*.go internal/statistics/*.go internal/storage/history.go internal/storage/history_test.go internal/storage/maintenance.go internal/storage/maintenance_test.go internal/storage/cycle.go internal/storage/cycle_test.go internal/storage/opportunities.go internal/storage/prices.go internal/storage/sqlite.go
          unformatted="$(gofmt -l cmd/scanner/*.go internal/arbitrage/*.go internal/market/*.go internal/config/*.go internal/storage/opportunities.go internal/exchange/bybit/tickers.go internal/exchange/mexc/*.go internal/exchange/okx/*.go internal/exchange/gate/*.go internal/exchange/bitget/*.go internal/price/snapshot.go internal/price/snapshot_test.go internal/scanner/*.go internal/statistics/*.go internal/storage/history.go internal/storage/history_test.go internal/storage/maintenance.go internal/storage/maintenance_test.go internal/storage/cycle.go internal/storage/cycle_test.go internal/storage/opportunities.go internal/storage/prices.go)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Запустить unit-тесты
        run: go test ./...

      - name: Запустить детерминированные бенчмарки
        run: go test -bench=. -benchmem ./...

      - name: Запустить локальную диагностику без сбора котировок
        run: go run ./cmd/scanner doctor --format json

      - name: Запустить go vet
        run: go vet ./...

      - name: Собрать все пакеты проекта
        run: go build ./...
