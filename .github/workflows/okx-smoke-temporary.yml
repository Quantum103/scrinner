name: OKX public API smoke (temporary)

on:
  push:
    branches:
      - "feat/stage-7-okx-adapter"

permissions:
  contents: read

jobs:
  public-api:
    name: Ограниченная проверка публичных API OKX
    runs-on: ubuntu-latest
    steps:
      - name: Проверить публичные endpoints без ключей
        shell: bash
        run: |
          set -euo pipefail
          base="https://openapi.okx.com"
          for kind in SPOT SWAP; do
            instruments="$(curl --fail --silent --show-error --retry 1 --retry-delay 1 --connect-timeout 10 --max-time 30 "$base/api/v5/public/instruments?instType=$kind")"
            echo "$instruments" | jq -e '.code == "0" and (.data | length) > 0' >/dev/null
            echo "$kind instruments: $(echo "$instruments" | jq '.data | length')"
            tickers="$(curl --fail --silent --show-error --retry 1 --retry-delay 1 --connect-timeout 10 --max-time 30 "$base/api/v5/market/tickers?instType=$kind")"
            echo "$tickers" | jq -e '.code == "0" and (.data | length) > 0' >/dev/null
            echo "$kind tickers: $(echo "$tickers" | jq '.data | length')"
          done
